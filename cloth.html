<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing | MenWear India</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(255, 255, 255, 0.07); --accent: #00f2fe; --bg: #030712; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: white; line-height: 1.6; overflow-x: hidden; }
        
        nav { position: fixed; top: 0; width: 100%; padding: 20px 5%; background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-between; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-weight: 800; font-size: 1.5rem; } .logo span { color: var(--accent); }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 0.9rem; transition: 0.3s; }
        nav a:hover { color: var(--accent); }

        .container { padding: 120px 5% 60px; max-width: 1400px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 60px; }
        header h1 { font-size: 2.5rem; letter-spacing: 2px; text-transform: uppercase; }
        header h1 span { color: var(--accent); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        
        .card { 
            background: var(--glass); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 25px; 
            padding: 20px; 
            transition: all 0.5s ease;
            position: relative;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--accent); }

        .badge { position: absolute; top: 30px; right: 30px; background: var(--accent); color: #000; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.7rem; z-index: 2; }

        .img-wrapper { 
            width: 100%; 
            height: 400px; 
            border-radius: 18px; 
            overflow: hidden; 
            margin-bottom: 20px; 
            background: #1a1e26; /* Sleek fallback color */
        }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; }
        .card:hover img { transform: scale(1.05); }

        .info h3 { font-size: 1.3rem; margin-bottom: 8px; }
        .price { font-size: 1.4rem; color: var(--accent); font-weight: 800; margin-bottom: 15px; display: block; }
        
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; text-decoration: none; text-align: center; font-size: 0.9rem;}
        .btn-main { background: var(--accent); color: #000; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; }
        .btn:hover { opacity: 0.8; }

        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav>
        <div class="logo">MEN<span>WEAR</span></div>
        <div><a href="index.html">Home</a><a href="cloth.html" style="color:var(--accent)">Cloth</a><a href="shoe.html">Shoes</a></div>
    </nav>

    <div class="container">
        <header>
            <h1>Premium <span>Collection</span></h1>
        </header>

        <div class="grid">
            <!-- Traditional Item -->
            <div class="card">
                <span class="badge">TRADITIONAL</span>
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1597983073493-88cd35cf93b0?auto=format&fit=crop&q=80&w=800" alt="Men Traditional Kurta">
                </div>
                <div class="info">
                    <h3>Royal Silk Kurta</h3>
                    <span class="price">₹2,899</span>
                    <div class="btn-group">
                        <button class="btn btn-main">Buy Now</button>
                        <a href="tel:+917814230949" class="btn btn-outline">Call</a>
                    </div>
                </div>
            </div>

            <!-- Casual Item (FIXED IMAGE) -->
            <div class="card">
                <span class="badge">CASUAL</span>
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&q=80&w=800" alt="Casual Men Shirt">
                </div>
                <div class="info">
                    <h3>Premium Denim Shirt</h3>
                    <span class="price">₹1,799</span>
                    <div class="btn-group">
                        <button class="btn btn-main">Buy Now</button>
                        <a href="tel:+917814230949" class="btn btn-outline">Call</a>
                    </div>
                </div>
            </div>

            <!-- Wedding Item -->
            <div class="card">
                <span class="badge">WEDDING</span>
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1617137984095-74e4e5e3613f?auto=format&fit=crop&q=80&w=800" alt="Wedding Sherwani">
                </div>
                <div class="info">
                    <h3>Embroidered Sherwani</h3>
                    <span class="price">₹14,499</span>
                    <div class="btn-group">
                        <button class="btn btn-main">Buy Now</button>
                        <a href="tel:+917814230949" class="btn btn-outline">Call</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Smooth scroll reveal logic for the cards
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = 1;
                    entry.target.style.transform = "translateY(0)";
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.card').forEach(card => {
            card.style.opacity = 0;
            card.style.transform = "translateY(20px)";
            card.style.transition = "all 0.6s ease-out";
            observer.observe(card);
        });
    </script>
</body>
</html>
