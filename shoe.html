<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoes | MenWear India</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(255, 255, 255, 0.07); --accent: #00f2fe; --bg: #030712; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: white; overflow-x: hidden; }
        
        nav { position: fixed; top: 0; width: 100%; padding: 20px 5%; background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-between; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-weight: 800; font-size: 1.5rem; } .logo span { color: var(--accent); }
        nav a { color: white; text-decoration: none; margin-left: 20px; transition: 0.3s; }

        .container { padding: 120px 5% 60px; max-width: 1400px; margin: 0 auto; }
        h2 { font-size: 2.5rem; text-align: center; margin-bottom: 50px; letter-spacing: 4px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; }
        
        .shoe-card { 
            background: var(--glass); 
            border-radius: 30px; 
            padding: 25px; 
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.4s;
        }
        .shoe-card:hover { background: rgba(255,255,255,0.15); transform: scale(1.02); }

        .shoe-img { width: 100%; height: 260px; object-fit: contain; margin-bottom: 20px; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5)); transition: 0.5s; }
        .shoe-card:hover .shoe-img { transform: rotate(-5deg) scale(1.1); }

        .price-tag { color: var(--accent); font-size: 1.5rem; font-weight: 800; display: block; margin: 10px 0; }
        .buy-now { background: var(--accent); border: none; padding: 12px 30px; border-radius: 50px; font-weight: 800; cursor: pointer; margin-top: 15px; }

        footer { text-align: center; padding: 40px; opacity: 0.5; font-size: 0.8rem; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">MEN<span>WEAR</span></div>
        <div><a href="index.html">Home</a><a href="cloth.html">Cloth</a><a href="shoe.html" style="color:var(--accent)">Shoes</a></div>
    </nav>

    <div class="container">
        <h2>THE <span>STEP</span> UP</h2>
        
        <div class="grid">
            <!-- Shoe 1 -->
            <div class="shoe-card">
                <img src="https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?q=80&w=2000&auto=format&fit=crop" class="shoe-img" alt="Sneaker">
                <h3>Vortex Urban Sneakers</h3>
                <span class="price-tag">₹4,200</span>
                <button class="buy-now">Add to Cart</button>
            </div>
            <!-- Shoe 2 -->
            <div class="shoe-card">
                <img src="https://images.unsplash.com/photo-1614252235316-8c857d38b5f4?q=80&w=2000&auto=format&fit=crop" class="shoe-img" alt="Boots">
                <h3>Heritage Leather Boots</h3>
                <span class="price-tag">₹5,999</span>
                <button class="buy-now">Add to Cart</button>
            </div>
            <!-- Shoe 3 -->
            <div class="shoe-card">
                <img src="https://images.unsplash.com/photo-1531310197839-ccf54634509e?q=80&w=2000&auto=format&fit=crop" class="shoe-img" alt="Loafer">
                <h3>Handcrafted Tan Loafers</h3>
                <span class="price-tag">₹3,450</span>
                <button class="buy-now">Add to Cart</button>
            </div>
        </div>
    </div>

    <footer>&copy; 2026 MenWear. All images optimized for high speed.</footer>
</body>
</html>
